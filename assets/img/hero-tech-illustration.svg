<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="heroCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <radialGradient id="glowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow circles -->
  <circle cx="480" cy="120" r="160" fill="url(#glowGlow)" />
  <circle cx="120" cy="380" r="140" fill="url(#glowGlow)" />

  <!-- Abstract floating circuit / connection lines -->
  <path d="M 50 100 Q 150 50 250 120 T 450 80" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" fill="none" stroke-dasharray="4 4" />
  <path d="M 120 450 Q 280 400 420 460 T 560 380" stroke="rgba(168, 85, 247, 0.2)" stroke-width="2" fill="none" stroke-dasharray="5 5" />

  <!-- Floating Tech Badge: Python Core -->
  <g transform="translate(60, 40)">
    <rect width="130" height="42" rx="21" fill="#0f172a" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="22" cy="21" r="8" fill="#38bdf8" />
    <path d="M 22 17 L 22 25 M 18 21 L 26 21" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <text x="38" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Python</text>
    <text x="88" y="26" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">#1</text>
  </g>

  <!-- Floating Tech Badge: Cloud & AWS interest -->
  <g transform="translate(410, 400)">
    <rect width="150" height="42" rx="21" fill="#0f172a" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
    <circle cx="22" cy="21" r="8" fill="#a855f7" />
    <path d="M 18 21 Q 20 18 23 18 Q 26 18 27 21" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="38" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Cloud / AWS</text>
  </g>

  <!-- Central Modern Code IDE Card -->
  <g transform="translate(80, 95)" filter="url(#softGlow)">
    <!-- Main Card Body -->
    <rect width="440" height="290" rx="16" fill="url(#heroCardBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="440" height="38" rx="16" fill="#1e293b" fill-opacity="0.8" />
    <rect y="26" width="440" height="12" fill="#1e293b" fill-opacity="0.8" />
    <line x1="0" y1="38" x2="440" y2="38" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="19" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="19" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="19" r="5" fill="#10b981" opacity="0.8" />
    
    <!-- Tab title -->
    <text x="220" y="24" font-family="monospace, Consolas" font-size="12" fill="#94a3b8" text-anchor="middle">ingenieria_informatica.py</text>
    
    <!-- Python Code Lines -->
    <g transform="translate(24, 62)" font-family="Consolas, 'Courier New', monospace" font-size="13">
      <!-- Line 1: class -->
      <text y="0">
        <tspan fill="#f43f5e">class</tspan> <tspan fill="#38bdf8" font-weight="bold">EstudianteInformatica</tspan><tspan fill="#e2e8f0">:</tspan>
      </text>

      <!-- Line 2: init -->
      <text y="24">
        <tspan fill="#94a3b8">&#160;&#160;def</tspan> <tspan fill="#a855f7">__init__</tspan><tspan fill="#e2e8f0">(self):</tspan>
      </text>

      <!-- Line 3: nombre -->
      <text y="48">
        <tspan fill="#e2e8f0">&#160;&#160;&#160;&#160;self.nombre =</tspan> <tspan fill="#34d399">"María José Zapata"</tspan>
      </text>

      <!-- Line 4: semestre -->
      <text y="72">
        <tspan fill="#e2e8f0">&#160;&#160;&#160;&#160;self.semestre =</tspan> <tspan fill="#fbbf24">5</tspan> <tspan fill="#64748b"># Unilasallista</tspan>
      </text>

      <!-- Line 5: enfoque -->
      <text y="96">
        <tspan fill="#e2e8f0">&#160;&#160;&#160;&#160;self.lenguaje_principal =</tspan> <tspan fill="#34d399">"Python"</tspan>
      </text>

      <!-- Line 6: herramientas -->
      <text y="120">
        <tspan fill="#e2e8f0">&#160;&#160;&#160;&#160;self.stack = [</tspan><tspan fill="#34d399">"Python"</tspan><tspan fill="#e2e8f0">,&#160;</tspan><tspan fill="#34d399">"MySQL"</tspan><tspan fill="#e2e8f0">,&#160;</tspan><tspan fill="#34d399">"GitHub"</tspan><tspan fill="#e2e8f0">]</tspan>
      </text>

      <!-- Line 7: interes -->
      <text y="144">
        <tspan fill="#e2e8f0">&#160;&#160;&#160;&#160;self.interes_cloud =</tspan> <tspan fill="#34d399">"AWS &amp; Servicios Cloud"</tspan>
      </text>

      <!-- Line 8: method -->
      <text y="174">
        <tspan fill="#f43f5e">&#160;&#160;def</tspan> <tspan fill="#38bdf8">construir_solucion</tspan><tspan fill="#e2e8f0">(self):</tspan>
      </text>
      <text y="198">
        <tspan fill="#f43f5e">&#160;&#160;&#160;&#160;return</tspan> <tspan fill="#e2e8f0">RutaKontrol(tipo=</tspan><tspan fill="#34d399">"TransporteCarga"</tspan><tspan fill="#e2e8f0">)</tspan>
      </text>
    </g>

    <!-- Terminal Status Bar -->
    <g transform="translate(20, 248)">
      <rect width="400" height="28" rx="6" fill="#090d16" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#10b981" />
      <text x="26" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Terminal: Estado activo &#8226; Comprometida &amp; Aplicada</text>
      <text x="385" y="18" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="end">UTF-8</text>
    </g>
  </g>

  <!-- Interactive data node markers -->
  <g transform="translate(48, 220)">
    <circle cx="16" cy="16" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 11 16 L 15 20 L 22 13" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>
  <g transform="translate(515, 170)">
    <circle cx="16" cy="16" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="16" y="21" font-family="monospace" font-size="11" fill="#a855f7" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
